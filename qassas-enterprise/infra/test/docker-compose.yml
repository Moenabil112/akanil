name: qassas-test

x-qassas-env: &qassas-env
  QASSAS_ENVIRONMENT: test
  QASSAS_RELEASE_ID: ${QASSAS_RELEASE_ID}
  QASSAS_SERVICE_VERSION: ${QASSAS_SERVICE_VERSION}
  QASSAS_REQUIRED_MIGRATION: ${QASSAS_REQUIRED_MIGRATION}
  DATABASE_URL: postgresql://${QASSAS_DB_USER}:${QASSAS_DB_PASSWORD}@qassas-db:5432/${QASSAS_DB_NAME}
  QASSAS_DB_PASSWORD: ${QASSAS_DB_PASSWORD}
  KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
  KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER}
  KEYCLOAK_API_CLIENT_ID: ${KEYCLOAK_API_CLIENT_ID}
  OPA_URL: ${OPA_URL}
  TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS}
  TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE}
  TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE}
  OUTBOX_PUBLISHER_ENABLED: ${OUTBOX_PUBLISHER_ENABLED}
  OUTBOX_PUBLISH_INTERVAL_MS: ${OUTBOX_PUBLISH_INTERVAL_MS}
  OUTBOX_PUBLISH_BATCH_SIZE: ${OUTBOX_PUBLISH_BATCH_SIZE}
  OUTBOX_CLAIM_TIMEOUT_SECONDS: ${OUTBOX_CLAIM_TIMEOUT_SECONDS}

services:
  qassas-db:
    image: ${POSTGIS_IMAGE}
    environment:
      POSTGRES_DB: ${QASSAS_DB_NAME}
      POSTGRES_USER: ${QASSAS_DB_USER}
      POSTGRES_PASSWORD: ${QASSAS_DB_PASSWORD}
    volumes:
      - qassas-test-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${QASSAS_DB_USER} -d ${QASSAS_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 30

  temporal-db:
    image: ${TEMPORAL_DB_IMAGE}
    environment:
      POSTGRES_USER: ${TEMPORAL_DB_USER}
      POSTGRES_PASSWORD: ${TEMPORAL_DB_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - qassas-test-temporal-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TEMPORAL_DB_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 30

  temporal-schema:
    image: ${TEMPORAL_ADMIN_TOOLS_IMAGE}
    depends_on:
      temporal-db:
        condition: service_healthy
    environment:
      POSTGRES_SEEDS: temporal-db
      POSTGRES_USER: ${TEMPORAL_DB_USER}
      POSTGRES_PWD: ${TEMPORAL_DB_PASSWORD}
      DB_PORT: 5432
    volumes:
      - ./setup-temporal-postgres.sh:/ops/setup-temporal-postgres.sh:ro
    entrypoint: ["/bin/sh", "/ops/setup-temporal-postgres.sh"]
    restart: "no"

  temporal:
    image: ${TEMPORAL_IMAGE}
    depends_on:
      temporal-schema:
        condition: service_completed_successfully
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${TEMPORAL_DB_USER}
      POSTGRES_PWD: ${TEMPORAL_DB_PASSWORD}
      POSTGRES_SEEDS: temporal-db
      BIND_ON_IP: 0.0.0.0
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/test-sql.yaml
    volumes:
      - ./dynamicconfig:/etc/temporal/config/dynamicconfig:ro
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7233"]
      interval: 5s
      timeout: 3s
      start_period: 20s
      retries: 60

  temporal-namespace:
    image: ${TEMPORAL_ADMIN_TOOLS_IMAGE}
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE}
    volumes:
      - ./create-temporal-namespace.sh:/ops/create-temporal-namespace.sh:ro
    entrypoint: ["/bin/sh", "/ops/create-temporal-namespace.sh"]
    restart: "no"

  keycloak:
    image: ${KEYCLOAK_IMAGE}
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    volumes:
      - ../../keycloak/realm:/opt/keycloak/data/import:ro

  opa:
    image: ${OPA_IMAGE}
    command: ["run", "--server", "--addr=0.0.0.0:8181", "/policies"]
    volumes:
      - ../../opa/policies:/policies:ro

  qassas-migrate:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: qassas-enterprise:test
    depends_on:
      qassas-db:
        condition: service_healthy
    environment:
      <<: *qassas-env
    command: ["node", "scripts/migrate.mjs"]
    restart: "no"

  qassas-api:
    image: qassas-enterprise:test
    depends_on:
      qassas-migrate:
        condition: service_completed_successfully
      temporal-namespace:
        condition: service_completed_successfully
      keycloak:
        condition: service_started
      opa:
        condition: service_started
    environment:
      <<: *qassas-env
      PORT: 3001
    ports:
      - "3001:3001"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/v1/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 5s
      timeout: 3s
      retries: 30

  qassas-worker:
    image: qassas-enterprise:test
    depends_on:
      temporal-namespace:
        condition: service_completed_successfully
      qassas-migrate:
        condition: service_completed_successfully
    environment:
      <<: *qassas-env
    command: ["node", "temporal/dist/worker.js"]

volumes:
  qassas-test-db:
  qassas-test-temporal-db:
