name: QASSAS O3 Institutional Portfolio Model

on:
  push:
    branches:
      - "qassas/o3-institutional-portfolios-data-pipeline"
    paths:
      - "qassas-enterprise/**"
      - ".github/workflows/qassas-o3-institutional-portfolios.yml"
  pull_request:
    paths:
      - "qassas-enterprise/**"
      - ".github/workflows/qassas-o3-institutional-portfolios.yml"

permissions:
  contents: read

jobs:
  institutional-model:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_DB: qassas
          POSTGRES_USER: qassas
          POSTGRES_PASSWORD: qassas-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qassas -d qassas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    defaults:
      run:
        working-directory: qassas-enterprise

    env:
      QASSAS_DB_HOST: 127.0.0.1
      QASSAS_DB_PORT: 5432
      QASSAS_DB_NAME: qassas
      QASSAS_DB_USER: qassas
      QASSAS_DB_PASSWORD: qassas-ci
      QASSAS_REQUIRED_MIGRATION: 202609240023_term_sheet_partner_data_scope.sql

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: qassas-enterprise/package-lock.json

      - name: Install locked dependency graph
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Apply canonical migrations
        run: npm run db:migrate

      - name: Seed institutional portfolios
        run: npm run db:seed:institutions

      - name: Verify institutional model and source contracts
        run: node scripts/o3-institutional-model-check.mjs

      - name: Verify tenant isolation and governed data pipeline
        run: node scripts/o3-data-pipeline-check.mjs

      - name: Validate institutional Workbench
        run: npm run o3:workbench-check

